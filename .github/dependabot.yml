version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  # The Dockerfile pins both base images to an exact patch tag so a rebuild is
  # reproducible; that only stays safe if something bumps them when the
  # upstream images are rebuilt for a CVE.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
