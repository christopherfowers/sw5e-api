# One origin for the site and the API, which is what the deployment gives them.
#
# The site addresses the API as `/api/...` on its own origin, on purpose: it
# keeps the cookie same-site, keeps CORS out of the picture entirely, and means
# the browser's origin check has one answer. A local stack that served the two
# on different ports would be a local stack where none of that is exercised, and
# where the site's own requests 404 against the static file server.
events {}

http {
  server {
    listen 8080;

    location /api/ {
      proxy_pass http://api:8080;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://web:8080;
      proxy_set_header Host $host;
    }
  }
}
